[project]
site_name = "delaycp"
site_description = "Online conformal prediction for streaming classification with delayed, class-imbalanced labels."
site_url = "https://adri0.github.io/delaycp/"
repo_url = "https://github.com/adri0/delaycp"
repo_name = "adri0/delaycp"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 Adriano Oliveira"
nav = [
  { "Home" = "index.md" },
  { "Concepts" = "concepts.md" },
  { "Example: IEEE-CIS chargebacks" = "examples/ieee_cis_chargebacks.md" },
  { "Validation scenarios" = "validation.md" },
  { "Roadmap" = "roadmap.md" },
  # "API Reference" is appended by the api-autonav plugin below.
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# API pages are generated from the NumPy-style docstrings in src/delaycp:
# api-autonav writes one page per module, rendered by mkdocstrings-python.
[project.plugins.api-autonav]
modules = ["src/delaycp"]
nav_section_title = "API Reference"
# The package page only lists the modules; re-exported classes are documented where defined.
module_options = { "^delaycp$" = { members = false } }

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_source = false
show_root_heading = true
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
scoped_crossrefs = true
filters = ["!^_"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
