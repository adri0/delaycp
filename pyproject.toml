[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "delaycp"
version = "0.1.0.dev0"
description = "Online conformal prediction for streaming classification with delayed, class-imbalanced labels."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Adriano Oliveira" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/adri0/delaycp"

[tool.hatch.build.targets.wheel]
packages = ["src/delaycp"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
